<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Arrow Puzzle</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#111827,#312e81);color:white;min-height:100vh;display:flex;justify-content:center;align-items:center}
.game{width:min(94vw,430px);text-align:center}.card{background:rgba(255,255,255,.1);padding:22px;border-radius:24px;box-shadow:0 15px 40px rgba(0,0,0,.3);backdrop-filter:blur(8px)}
h1{margin:0 0 8px;font-size:34px}.info{display:flex;justify-content:space-between;margin:14px 0;font-weight:bold}
#target{font-size:24px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
button.arrow{height:90px;border:0;border-radius:18px;background:white;font-size:42px;cursor:pointer;box-shadow:0 6px 12px rgba(0,0,0,.2);transition:.12s}
button.arrow:active{transform:scale(.92)}button.arrow.correct{background:#86efac}button.arrow.wrong{background:#fca5a5}
#message{height:28px;font-weight:bold}#restart{border:0;border-radius:12px;padding:12px 22px;font-size:16px;font-weight:bold;cursor:pointer}
small{opacity:.75}
</style>
</head>
<body>
<div class="game"><div class="card">
<h1>🎯 Arrow Puzzle</h1><small>Tap the arrow that matches the target!</small>
<div class="info"><span>Level: <b id="level">1</b></span><span>Score: <b id="score">0</b></span></div>
<div id="target">Target: ➡️</div>
<div class="grid" id="grid"></div>
<div id="message"></div>
<br><button id="restart">Restart Game</button>
</div></div>
<script>
const arrows=["⬆️","➡️","⬇️","⬅️"];
let level=1,score=0,target="";
const grid=document.getElementById("grid"),targetEl=document.getElementById("target"),levelEl=document.getElementById("level"),scoreEl=document.getElementById("score"),msg=document.getElementById("message");

function newRound(){
 target=arrows[Math.floor(Math.random()*arrows.length)];
 targetEl.textContent="Target: "+target;
 grid.innerHTML="";
 let correct=Math.floor(Math.random()*9);
 for(let i=0;i<9;i++){
   let b=document.createElement("button"); b.className="arrow";
   b.textContent=i===correct?target:arrows[Math.floor(Math.random()*arrows.length)];
   b.onclick=()=>choose(b);
   grid.appendChild(b);
 }
}
function choose(b){
 if(b.textContent===target){
   b.classList.add("correct"); score+=10; scoreEl.textContent=score;
   msg.textContent="✅ Correct!";
   level=Math.floor(score/50)+1; levelEl.textContent=level;
   setTimeout(newRound,350);
 }else{
   b.classList.add("wrong"); msg.textContent="❌ Try again!";
   setTimeout(()=>b.classList.remove("wrong"),300);
 }
}
document.getElementById("restart").onclick=()=>{level=1;score=0;levelEl.textContent=1;scoreEl.textContent=0;msg.textContent="";newRound()};
newRound();
</script>
</body>
</html>
